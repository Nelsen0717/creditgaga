<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刷神卡卡">
<meta name="theme-color" content="#050607">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CreditGaga 刷神卡卡</title>
<style>
:root{
  --bg:#050607; --surface:#101216; --surface2:#181b21; --line:#262a32;
  --ink:#fff; --muted:#9aa3ad; --accent:#34e1a1; --accent-ink:#04140d; --warn:#f5c451; --warn-ink:#2a1e00; --danger:#ff6b6b;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.22,1.35,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
body{position:fixed;inset:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea,select{font:inherit;}
#app{position:absolute;inset:0;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(var(--sab) + 32px);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) 16px 8px;position:relative;z-index:5;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em;}
.top-right{display:flex;align-items:center;gap:8px;}
.pill{height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.pill.accent{background:var(--accent);color:var(--accent-ink);}
.icon-btn{width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
.icon-btn.flat{background:var(--surface2);}

/* mascot 卡卡 */
.mascot{width:34px;height:24px;border-radius:6px;background:linear-gradient(160deg,#fff,#d9dce2);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.mascot::before,.mascot::after{content:"";position:absolute;top:8px;width:5px;height:7px;border-radius:3px;background:#0a2a1e;animation:blink 4.2s infinite;}
.mascot::before{left:10px}.mascot::after{left:19px}
.mascot i{position:absolute;right:-3px;top:-4px;width:10px;height:10px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);}
.mascot.big{width:96px;height:66px;border-radius:14px;}
.mascot.big::before,.mascot.big::after{top:22px;width:12px;height:18px;border-radius:6px;}
.mascot.big::before{left:28px}.mascot.big::after{left:54px}
.mascot.big i{width:24px;height:24px;right:-8px;top:-10px;}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* HOME */
#home{background:#000;}
#cam,#freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
#freeze{display:none;}
body.nocam #cam{display:none;}
.vf-bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,#1c2a25 0%,#0a0d0c 55%,#000 100%);display:none;}
body.nocam .vf-bg{display:block;}
.vf-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 78%,#000 100%);pointer-events:none;}
.vf-frame{position:absolute;left:50%;top:38%;width:64vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;}
.vf-frame i{position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.85);border-radius:4px;}
.vf-frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.vf-frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.vf-frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.vf-frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.hint{position:absolute;left:0;right:0;top:calc(38% + 34vw + 8px);text-align:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;}
.hint b{display:block;font-size:24px;letter-spacing:-.02em;color:#fff;margin-bottom:4px;}
.scenes{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 236px);display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;z-index:4;}
.scenes::-webkit-scrollbar{display:none}
.scenes button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;font-weight:600;white-space:nowrap;}
.scenes .lab{flex:0 0 auto;align-self:center;font-size:12px;color:var(--muted);font-weight:600;}
#stack{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 96px);height:150px;perspective:900px;z-index:3;}
.stk{position:absolute;left:50%;bottom:0;width:150px;height:96px;margin-left:-75px;border-radius:9px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset;transform-origin:50% 100%;transition:transform .6s var(--spring),opacity .4s;background:#222;}
.stk img,.hero img,.wcard .face img,.alt .thumb img,.wl-card img,.hist .thumb img,.sb-card img,.gx-node .pl img{position:absolute;inset:0;width:100%;height:100%;transform:none;object-fit:cover;display:block;}
.hero,.wcard .face,.alt .thumb{position:relative;}
.stk.solid{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-.01em;padding:10px;text-align:center;}
.stk.add{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.35);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.controls{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 12px);height:84px;display:flex;align-items:center;justify-content:center;gap:0;z-index:6;}
.controls .side{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:27px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;gap:2px;}
.controls .side span{font-size:20px;line-height:1;}
.controls .side.l{left:34px}.controls .side.r{right:34px}
#shutter{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 0 7px #fff;transition:transform .15s;}
#shutter:active{transform:scale(.9)}
body.nocam #shutter{background:var(--accent);box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 0 7px var(--accent);}

/* RESULT */
#result{background:#000;}
.res-bg{position:absolute;inset:0;overflow:hidden;}
.res-bg img{width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.35);transform:scale(1.1);}
.res-top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 16px 0;}
.res-top .who{flex:1;min-width:0;}
.res-top .who b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-top .who span{font-size:13px;color:var(--muted);}
.scan{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:2;}
.scan .laser{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px var(--accent);animation:laser 1.6s ease-in-out infinite;}
@keyframes laser{0%{top:22%}50%{top:70%}100%{top:22%}}
.scan .txt{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.scan .sub{font-size:14px;color:var(--muted);}
.res-body{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 20px calc(var(--sab) + 16px);overflow-y:auto;}
.hero{width:min(78vw,330px);aspect-ratio:1.586;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1) inset;margin:8px 0 14px;animation:rise 1s var(--spring) both;background:#222;}
.hero.solid{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;text-align:center;padding:20px;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 45%,rgba(48,227,162,.25) 50%,rgba(255,255,255,0) 62%);background-size:220% 100%;background-position:var(--shx,120%) 0;pointer-events:none;mix-blend-mode:screen;}
@keyframes rise{0%{transform:translateY(58vh) rotateX(55deg) scale(.55);opacity:0}45%{opacity:1}100%{transform:translateY(0) rotateX(0) scale(1);opacity:1}}
.rate{font-size:clamp(84px,26vw,120px);font-weight:800;letter-spacing:-.05em;line-height:.95;color:var(--accent);animation:pop .7s var(--spring) .55s both;}
.rate small{font-size:.42em;letter-spacing:-.02em;}
.cardname{font-size:17px;font-weight:700;margin-top:2px;animation:fadeup .5s .7s both;text-align:center;}
.back{font-size:22px;font-weight:700;margin-top:14px;animation:fadeup .5s .8s both;text-align:center;}
.back b{color:var(--accent);}
.back small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px;}
.cond{margin-top:16px;width:100%;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;animation:fadeup .5s .95s both;display:flex;gap:10px;align-items:flex-start;}
.cond .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:3px;}
.unlock{margin-top:10px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;animation:fadeup .5s 1.1s both;text-align:left;}
.unlock .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75;}
.unlock .v{font-size:19px;font-weight:800;line-height:1.25;margin-top:2px;letter-spacing:-.01em;}
.unlock .h{font-size:13.5px;margin-top:6px;opacity:.85;line-height:1.35;}
.unlock .b{display:inline-block;margin-top:10px;background:var(--accent-ink);color:var(--accent);padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;}
.pay{margin-top:12px;font-size:14px;color:var(--muted);animation:fadeup .5s 1.2s both;text-align:center;}
.pay b{color:#fff;}
.actions{display:flex;gap:10px;width:100%;margin-top:18px;animation:fadeup .5s 1.3s both;}
.btn{flex:1;height:56px;border-radius:18px;font-size:17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;transition:transform .12s;}
.btn:active{transform:scale(.97)}
.btn.primary{background:#fff;color:#000;}
.btn.accent{background:var(--accent);color:var(--accent-ink);}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;}
.btn.sm{height:44px;font-size:15px;border-radius:14px;flex:0 0 auto;padding:0 16px;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.alts{width:100%;margin-top:14px;animation:fadeup .4s both;}
.alt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);}
.alt .thumb{width:54px;height:34px;border-radius:5px;overflow:hidden;background:#333;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;}
.alt .n{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alt .n small{display:block;color:var(--muted);font-weight:500;font-size:12px;white-space:normal;}
.alt .r{font-weight:800;font-size:18px;letter-spacing:-.02em;}
.alt .r small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right;}
.alt.locked .r{color:var(--warn);}

/* generic page */
.page-title{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 4px;}
.page-sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.4;}
.h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;}
.card-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.wcard{background:var(--surface);border-radius:16px;padding:10px;position:relative;}
.wcard .face{width:100%;aspect-ratio:1.586;border-radius:8px;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;text-align:center;padding:6px;}
.wcard .nm{font-size:13px;font-weight:700;margin-top:8px;line-height:1.25;min-height:32px;}
.wcard .bt{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px;}
.wcard .bt b{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--accent);}
.wcard .bt small{font-size:11px;color:var(--muted);}
.wcard .tag{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;backdrop-filter:blur(8px);}
.wcard .tag.warn{background:var(--warn);color:#2a1800;}
.wcard .tag.ai{background:var(--accent);color:var(--accent-ink);}
.wcard.def .face{outline:2px solid var(--accent);outline-offset:2px;}
.stat{background:var(--surface);border-radius:20px;padding:18px;}
.stat .k{font-size:13px;color:var(--muted);font-weight:600;}
.stat .v{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:4px;}
.stat .v.acc{color:var(--accent);}
.stat .s{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.quest{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;}
.quest .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,179,64,.16);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.quest.done .ic{background:rgba(48,227,162,.16);}
.quest .tx{flex:1;min-width:0;}
.quest .tx b{display:block;font-size:15px;line-height:1.3;}
.quest .tx small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35;}
.quest .xp{font-size:13px;font-weight:800;color:var(--warn);white-space:nowrap;}
.quest.done .xp{color:var(--accent);}
.bars{background:var(--surface);border-radius:20px;padding:16px;}
.bar{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;margin:8px 0;font-size:13px;}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.bar .t{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;}
.bar .f{height:100%;border-radius:5px;background:var(--accent);transform-origin:left;animation:grow .9s var(--spring) both;}
.bar .f.dim{background:rgba(255,255,255,.35);}
.bar .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lvl-ring{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:14px 16px;}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),rgba(255,255,255,.1) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;}
.lvl-ring .tx b{display:block;font-size:18px;}
.lvl-ring .tx small{color:var(--muted);font-size:13px;}
.fix{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;align-items:flex-start;}
.fix .no{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px;}
.fix .tx{flex:1;min-width:0;}
.fix .tx b{display:block;font-size:15.5px;line-height:1.3;}
.fix .tx small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35;}
.fix .g{font-weight:800;color:var(--accent);white-space:nowrap;font-size:16px;letter-spacing:-.02em;}
.txn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;}
.txn .m{font-weight:600;}
.txn .d{color:var(--muted);font-size:12px;}
.txn .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.txn .g{text-align:right;font-size:12px;color:var(--accent);font-weight:700;}
.txn .g.z{color:var(--muted);font-weight:500;}
.bigwrap{text-align:center;padding:10px 0 4px;}
.bignum{font-size:clamp(64px,20vw,96px);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;}
.bignum small{font-size:.38em;letter-spacing:-.02em;margin-right:4px;}
.bigk{font-size:15px;color:var(--muted);font-weight:600;margin-top:6px;}
.grid-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.samples button{aspect-ratio:1.586;border-radius:8px;overflow:hidden;background:#222;position:relative;}
.samples button img{width:100%;height:100%;object-fit:cover;display:block;}
.samples button.has::after{content:"✓";position:absolute;inset:auto 4px 4px auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;}

/* MASK */
#maskWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
#maskCv{max-width:100%;max-height:100%;touch-action:none;border-radius:6px;}
.mask-tools{padding:12px 20px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px;}
.mask-tools .row{display:flex;gap:10px;}

/* sheet */
#sheet{position:absolute;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.55);}
#sheet.on{display:flex;}
.sheet-in{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:14px 20px calc(var(--sab) + 24px);animation:up .35s var(--spring);}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.sheet-in h3{font-size:22px;margin:8px 0 4px;letter-spacing:-.02em;}
.sheet-in p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:#fff;padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;}
.field textarea{height:80px;padding:12px 14px;resize:none;}
.field input.big{height:70px;font-size:34px;font-weight:800;text-align:center;letter-spacing:-.02em;}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;}
.seg button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);}
.seg button.on{background:#fff;color:#000;}
.note{font-size:12px;color:var(--muted);line-height:1.45;}
.note a{color:var(--accent);}
#toast{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 110px);z-index:60;display:flex;justify-content:center;pointer-events:none;}
#toast div{background:rgba(255,255,255,.95);color:#000;padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;max-width:100%;text-align:center;animation:fadeup .3s;box-shadow:0 10px 30px rgba(0,0,0,.5);}
#toast div.err{background:var(--danger);color:#fff;}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:70;}
.src{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;word-break:break-all;}
.src a{color:var(--muted);}
.tap{color:var(--accent);font-weight:700;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:15px;line-height:1.5;}
.mono{font-variant-numeric:tabular-nums;}
.hidden{display:none!important;}

/* mascot moods */
.mascot.think::before,.mascot.think::after{animation:look 1.6s ease-in-out infinite;}
@keyframes look{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
.mascot.big.think::before,.mascot.big.think::after{animation:lookbig 1.6s ease-in-out infinite;}
@keyframes lookbig{0%,100%{transform:translateX(-6px) translateY(-2px)}50%{transform:translateX(7px) translateY(-2px)}}
.mascot.happy::before,.mascot.happy::after{height:4px;width:7px;border-radius:0 0 6px 6px;background:none;border:3px solid #0a2a1e;border-top:0;top:10px;animation:none;}
.mascot.big.happy::before,.mascot.big.happy::after{height:9px;width:16px;border-width:5px;top:26px;}
.mascot.big.happy::before{left:26px}.mascot.big.happy::after{left:52px}
.mascot.wow::before,.mascot.wow::after{width:7px;height:9px;border-radius:50%;animation:none;}
.mascot.big.wow::before,.mascot.big.wow::after{width:16px;height:22px;top:20px;}
.mascot.wink::after{height:3px;width:7px;border-radius:2px;top:11px;animation:none;}
.mascot.big.wink::after{height:5px;width:16px;top:30px;}
.mascot.sad::before,.mascot.sad::after{animation:none;transform:rotate(12deg);}
.mascot.sad::after{transform:rotate(-12deg);}
.mascot.sad{filter:saturate(.7);}
.mascot .zz{position:absolute;left:100%;top:-10px;margin-left:6px;font-size:12px;font-weight:800;color:var(--accent);animation:fadeup .5s;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mascot.big{animation:bob 2.4s ease-in-out infinite;}

/* scan chips */
.scan .chips{display:flex;gap:8px;margin-top:6px;}
.scan .chips span{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:13px;font-weight:700;color:var(--muted);transition:all .4s;}
.scan .chips span.on{background:var(--accent);color:var(--accent-ink);transform:scale(1.06);}
.scan .ring{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:2px solid rgba(48,227,162,.35);animation:ring 1.8s ease-out infinite;}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.8);opacity:0}}

/* GALAXY */
#galaxy .brand>div{white-space:nowrap;}
#galaxy .pill{font-size:12px;padding:0 10px;}
#galaxy .topbar{padding-right:12px;}
#galaxy{background:#000;}
#gxCv{position:absolute;inset:0;width:100%;height:100%;}
#gxSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#gxSvg line{stroke-width:1.4;stroke-linecap:round;}
#gxSvg line.win{stroke:var(--accent);opacity:.75;stroke-dasharray:4 5;animation:dash 1.6s linear infinite;}
#gxSvg line.pot{stroke:var(--warn);opacity:.35;stroke-dasharray:2 6;}
@keyframes dash{to{stroke-dashoffset:-18}}
.gx-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
.gx-node .pl{border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 30px rgba(48,227,162,.25);position:relative;background:#222;animation:bob 5s ease-in-out infinite;}
.gx-node .pl.solid{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:6px;}
.gx-node .pl b{position:absolute;right:-6px;bottom:-4px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.6);}
.gx-node .nm{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000;max-width:90px;line-height:1.15;}
.gx-node.cat .em{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 1px rgba(255,255,255,.12);}
.gx-node.cat.locked .em{box-shadow:0 0 0 1.5px var(--warn);}
.gx-node.cat .nm{color:var(--muted);font-size:10.5px;}
.gx-top{position:absolute;left:0;right:0;top:0;z-index:5;}
.gx-strat{padding:0 20px;font-size:13px;color:var(--muted);line-height:1.5;}
.gx-strat b{color:#fff;}
.gx-bottom{position:absolute;left:20px;right:20px;bottom:calc(var(--sab) + 18px);z-index:5;display:flex;flex-direction:column;gap:10px;}
.gx-bottom .row{display:flex;gap:10px;}
.btn.huge{height:64px;font-size:20px;border-radius:22px;}
.gx-tip{position:absolute;left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.95);color:#000;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:700;max-width:280px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadeup .25s;pointer-events:none;}
.gx-tip small{display:block;font-weight:500;color:#555;margin-top:2px;}

/* equivalents */
.eq-wrap{background:var(--surface);border-radius:20px;padding:16px;}
.eq-year{font-size:13px;color:var(--muted);font-weight:600;}
.eq-year b{display:block;font-size:34px;color:#fff;letter-spacing:-.03em;margin-top:2px;}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.eq{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:96px;position:relative;overflow:hidden;}
.eq .em{font-size:26px;line-height:1;}
.eq .n{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--accent);}
.eq .l{font-size:12px;color:var(--muted);line-height:1.3;}
.eq .p{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.8;}
.eq.locked .n{color:#fff;}
.eq.locked .em{filter:grayscale(1);opacity:.5;}
.cups{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;}
.cups i{width:12px;height:14px;border-radius:2px 2px 4px 4px;background:var(--accent);opacity:.9;animation:pop .4s both;}
.cups i.g{background:rgba(255,255,255,.15);animation:none;}
.donut{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:14px 16px;}
.donut svg{width:84px;height:84px;flex:0 0 auto;transform:rotate(-90deg);}
.donut .tx{font-size:13px;color:var(--muted);line-height:1.5;}
.donut .tx b{color:#fff;}
.typebar{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 286px);z-index:4;display:flex;}
.typebar button{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:15px;font-weight:600;color:rgba(255,255,255,.85);text-align:left;padding:0 16px;display:flex;align-items:center;gap:8px;}

/* STRATEGY BOARD (replaces the ring graph) */
#galaxy .aurora{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 40% at 20% 0%,rgba(52,225,161,.22),transparent 60%),radial-gradient(70% 35% at 90% 10%,rgba(245,196,81,.14),transparent 60%),radial-gradient(100% 60% at 50% 110%,rgba(52,225,161,.08),transparent 60%);}
#sbBody{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 118px) 18px calc(var(--sab) + 150px);perspective:900px;}
.sb-row{display:flex;gap:14px;align-items:center;margin-bottom:18px;animation:fadeup .6s var(--spring) both;}
.sb-card{width:132px;aspect-ratio:1.586;border-radius:11px;overflow:hidden;position:relative;flex:0 0 auto;box-shadow:0 22px 40px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08) inset;transform:rotateY(16deg) rotateX(5deg);transform-style:preserve-3d;background:#222;}
.sb-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.28) 48%,rgba(52,225,161,.18) 53%,rgba(255,255,255,0) 66%);mix-blend-mode:screen;}
.sb-card.solid{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-align:center;padding:8px;}
.sb-row.lead .sb-card{width:164px;transform:rotateY(12deg) rotateX(4deg) scale(1.02);box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 60px rgba(52,225,161,.12),0 0 0 1px rgba(255,255,255,.1) inset;}
.sb-info{flex:1;min-width:0;}
.sb-name{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-head{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px;}
.sb-head b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1;}
.sb-row.lead .sb-head b{font-size:40px;}
.sb-head span{font-size:12px;color:var(--muted);font-weight:600;}
.sb-chips{display:flex;flex-wrap:wrap;gap:5px;}
.sb-chips span{font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;white-space:nowrap;}
.sb-chips span i{font-style:normal;color:var(--accent);margin-left:4px;font-variant-numeric:tabular-nums;}
.sb-chips span.lock{background:rgba(245,196,81,.12);color:var(--warn);}
.sb-chips span.lock i{color:var(--warn);}
.sb-chips span.none{background:none;color:var(--muted);font-weight:500;}
.sb-lock{margin-top:8px;border-top:1px solid var(--line);padding-top:14px;}
.sb-lock .h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-bottom:8px;}
.sb-lock .sb-chips span{background:rgba(245,196,81,.1);color:#fff;}
.sb-lock .sb-chips span i{color:var(--warn);}
.sb-lock .sb-chips span em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px;}
.ic{width:20px;height:20px;display:inline-block;vertical-align:-4px;}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.controls .side .ic{width:22px;height:22px;}
.quest .ic{font-size:0;}
.quest .ic .ic{width:20px;height:20px;color:var(--warn);}
.quest.done .ic .ic{color:var(--accent);}
.eq .em{width:28px;height:28px;color:var(--accent);}
.eq .em svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.eq.locked .em{color:var(--muted);}
.unlock{background:linear-gradient(135deg,var(--warn),#ffd77a);color:var(--warn-ink);}
.unlock .b{background:var(--warn-ink);color:var(--warn);}
.alt.locked .r{color:var(--warn);}
.bignum{color:var(--danger);}
.cups i{background:var(--danger);}
.eq .n{color:#fff;}
.eq .p{background:var(--warn);}
.donut .l{color:var(--danger);}
.wcard .tag.warn{background:var(--warn);color:var(--warn-ink);}
.fix .g{color:var(--accent);}

/* WALLET-OPEN ENTRY */
#galaxy{display:none;flex-direction:column;}
#galaxy.active{display:flex;}
#galaxy .topbar{position:relative;z-index:5;}
.wl-stage{position:relative;flex:1;min-height:0;perspective:1000px;z-index:2;}
.wl-mascot{position:absolute;left:50%;top:14%;transform:translate(-50%,-50%);z-index:1;animation:none;}
.wl-mascot.big{width:112px;height:76px;border-radius:16px;}
.wl-mascot.big::before,.wl-mascot.big::after{top:26px;width:13px;height:20px;}
.wl-mascot.big::before{left:34px}.wl-mascot.big::after{left:64px}
.wl-mascot.big i{width:26px;height:26px;right:-9px;top:-11px;}
.wl-mascot.jump{animation:jump .7s var(--spring);}
@keyframes jump{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-70%) scale(1.08,.92)}70%{transform:translate(-50%,-46%) scale(.96,1.06)}100%{transform:translate(-50%,-50%) scale(1)}}
.wl-card{position:absolute;left:50%;top:14%;width:164px;aspect-ratio:1.586;margin-left:-82px;margin-top:-52px;border-radius:12px;overflow:hidden;background:#222;box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08) inset;transform-origin:50% 120%;transform:translate3d(0,0,0) scale(.15);opacity:0;transition:transform .9s var(--spring),opacity .35s,filter .4s;z-index:2;}
.wl-card.solid{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;text-align:center;padding:10px;}
.wl-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.26) 48%,rgba(52,225,161,.16) 53%,rgba(255,255,255,0) 66%);mix-blend-mode:screen;}
.wl-card .w{position:absolute;right:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;padding:3px 8px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.5);}
.wl-card.dim{filter:brightness(.45) saturate(.6);}
.wl-info{position:relative;z-index:3;padding:0 20px 8px;text-align:center;min-height:118px;}
.wl-head{font-size:15px;color:var(--muted);font-weight:600;line-height:1.5;}
.wl-head b{color:#fff;font-size:17px;}
.wl-head .gold{color:var(--warn);}
.wl-focus{animation:fadeup .35s var(--spring) both;}
.wl-focus .nm{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.wl-focus .rt{font-size:52px;font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1;margin:2px 0 8px;}
.wl-focus .sb-chips{justify-content:center;}
.wl-cta{position:relative;z-index:3;padding:6px 20px calc(var(--sab) + 16px);display:flex;gap:10px;align-items:center;}
.wl-cta .btn.huge{flex:1;}
.wl-cta .icon-btn{width:56px;height:56px;border-radius:18px;background:var(--surface2);flex:0 0 auto;}
.wl-cta .icon-btn .ic{width:24px;height:24px;color:#fff;}
#galaxy .aurora{z-index:0;}
#gxCv{z-index:0;}
/* saved statements */
.stmt-saved{display:flex;gap:12px;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;align-items:center;}
.stmt-saved .l{flex:1;min-width:0;}
.stmt-saved .l b{display:block;font-size:15px;}
.stmt-saved .l small{color:var(--muted);font-size:12.5px;}
.stmt-saved .v{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--danger);white-space:nowrap;}
.stmt-saved .v small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right;}

/* BUTTON SYSTEM — pressable, Duolingo-style depth on an Apple-clean base */
.btn{position:relative;border-radius:20px;transition:transform .08s,box-shadow .08s;letter-spacing:-.01em;}
.btn.accent{background:linear-gradient(180deg,#4bf0b6,#2fd898);color:var(--accent-ink);box-shadow:0 5px 0 #17996a,inset 0 1px 0 rgba(255,255,255,.45);}
.btn.primary{background:linear-gradient(180deg,#fff,#e9ecf1);color:#000;box-shadow:0 5px 0 #aab0ba,inset 0 1px 0 rgba(255,255,255,.9);}
.btn.ghost{background:linear-gradient(180deg,#22262d,#181b21);color:#fff;box-shadow:0 5px 0 #0a0b0e,inset 0 1px 0 rgba(255,255,255,.08);}
.btn:active{transform:translateY(4px);}
.btn.accent:active{box-shadow:0 1px 0 #17996a,inset 0 1px 0 rgba(255,255,255,.45);}
.btn.primary:active{box-shadow:0 1px 0 #aab0ba;}
.btn.ghost:active{box-shadow:0 1px 0 #0a0b0e;}
.btn.huge{height:66px;font-size:21px;border-radius:24px;}
.btn.sm{height:46px;border-radius:15px;box-shadow:0 4px 0 #0a0b0e;}
.btn.sm.accent{box-shadow:0 4px 0 #17996a;}
.btn.sm:active{transform:translateY(3px);}
.wl-cta .icon-btn{background:linear-gradient(180deg,#22262d,#181b21);box-shadow:0 5px 0 #0a0b0e,inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s,box-shadow .08s;}
.wl-cta .icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a0b0e;}
.unlock .b{box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s;}
.unlock .b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.pill.accent{background:linear-gradient(180deg,#4bf0b6,#2fd898);box-shadow:0 2px 0 #17996a;}
.icon-btn{box-shadow:0 2px 0 rgba(0,0,0,.35);}
#shutter{box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 0 7px #fff,0 8px 24px rgba(0,0,0,.5);}
body.nocam #shutter{background:linear-gradient(180deg,#4bf0b6,#2fd898);}
.controls .side{box-shadow:0 3px 0 rgba(0,0,0,.45);}
.scenes button{box-shadow:0 2px 0 rgba(0,0,0,.4);}
.typebar button{box-shadow:0 2px 0 rgba(0,0,0,.4);}
.seg button.on{background:linear-gradient(180deg,#fff,#e9ecf1);box-shadow:0 2px 0 #aab0ba;}
.mask-tools .row .btn.sm{flex:0 0 auto;}

/* TOUCH FEEDBACK — visible on a mirrored screen */
.tap-ripple{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:rgba(52,225,161,.55);box-shadow:0 0 0 2px rgba(52,225,161,.9);pointer-events:none;z-index:999;animation:ripple .55s ease-out forwards;}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(4.2);opacity:0}}
.pressed{animation:pressflash .42s ease-out;}
@keyframes pressflash{0%{filter:brightness(1.6);box-shadow:0 0 0 0 rgba(52,225,161,.8)}100%{filter:brightness(1);box-shadow:0 0 0 14px rgba(52,225,161,0)}}
.btn.pressed,.icon-btn.pressed,.pill.pressed,.scenes button.pressed,.controls .side.pressed,.typebar button.pressed{animation:pressflash .42s ease-out,pressbump .3s var(--spring);}
@keyframes pressbump{0%{transform:scale(.93)}100%{transform:scale(1)}}
.stk.pressed,.wl-card.pressed,.wcard.pressed,.quest.pressed,.samples button.pressed,.stmt-saved.pressed,.hist.pressed{outline:3px solid var(--accent);outline-offset:3px;}
/* READ STRIP on result */
.read{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin:4px 0 6px;animation:fadeup .35s both;}
.read .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
.read .m{flex:1;min-width:0;}
.read .m b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.read .m span{font-size:15px;color:var(--muted);font-weight:600;}
.read .m span i{font-style:normal;color:#fff;}
.read .e{height:38px;padding:0 12px;border-radius:12px;background:#fff;color:#000;font-size:14px;font-weight:800;display:inline-flex;align-items:center;white-space:nowrap;box-shadow:0 3px 0 #aab0ba;}
.res-top .who{display:none;}
/* history */
.hist{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;}
.hist .thumb{width:54px;height:34px;border-radius:5px;overflow:hidden;background:#333;flex:0 0 auto;position:relative;}
.hist .tx{flex:1;min-width:0;}
.hist .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist .tx small{display:block;color:var(--muted);font-size:12.5px;}
.hist .r{text-align:right;white-space:nowrap;}
.hist .r b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--accent);}
.hist .r small{font-size:11px;color:var(--muted);font-weight:700;}
.hist.used .r small{color:var(--accent);}
</style>
</head>
<body>
<div id="app">

<!-- WALLET-OPEN ENTRY -->
<section id="galaxy" class="screen active">
  <canvas id="gxCv"></canvas>
  <div class="aurora"></div>
  <header class="topbar">
    <div class="brand"><div><span data-t="app"></span><small data-t="galaxySub"></small></div></div>
    <div class="top-right"><button class="pill accent" id="gxLvl"></button><button class="icon-btn" id="gxLang">EN</button><button class="icon-btn" id="gxGear">⚙</button></div>
  </header>
  <div class="wl-stage" id="wlStage"><div class="mascot big wl-mascot" id="gxMascot"><i></i></div></div>

<script>
/* ---------- STATE ---------- */
const S=Object.assign({wallet:DEFAULT_WALLET.slice(),custom:[],flags:{cube_plan:null},usage:{},xp:0,saved:0,history:[],lang:'zh',apiKey:'',model:'claude-sonnet-5',demo:false,defaultCard:'dbs_everyday',ym:''},JSON.parse(localStorage.getItem('cg_state')||'{}'));
function save(){localStorage.setItem('cg_state',JSON.stringify(S));}
function monthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
if(S.ym!==monthKey()){S.ym=monthKey();S.usage={};S.saved=0;save();}
LANG=S.lang||'zh';
const allCards=()=>[...CATALOG,...S.custom];
const cardById=id=>allCards().find(c=>c.id===id);
const walletCards=()=>S.wallet.map(cardById).filter(Boolean);

/* ---------- FORMAT ---------- */
const pct=r=>String(+(r*100).toFixed(2))+'%';
const money=v=>{const a=Math.abs(v);const s=a<10?(Math.round(a*10)/10).toString():Math.round(a).toLocaleString('en-US');return (v<0?'-':'')+'NT$'+s;};
const num=v=>Math.round(v).toLocaleString('en-US');
function rewardLabel(card,v){if(card.currency.type==='cash')return money(v);const pts=v*(card.currency.perTWD||1);return '≈ '+num(pts)+' '+L(card.currency.name)+' ≈ '+money(v);}

/* ---------- ENGINE: rules in data, computed here, never by the model ---------- */
const JKT=['JP','KR','TH'];
function ruleMatches(rule,ctx){
  if(rule.cats&&rule.cats.length===0&&!rule.merchants)return false;
  const overseas=ctx.country&&ctx.country!=='TW';
  if(rule.region==='TW'&&overseas)return false;
  if(rule.channel==='physical'&&ctx.online)return false;
  if(rule.channel==='online'&&!ctx.online)return false;
  if(rule.minTxn&&ctx.amount<rule.minTxn)return false;
  const m=((ctx.merchant||'')+' '+(ctx.brand||'')).toLowerCase();
  if(rule.merchants&&rule.merchants.some(k=>m.includes(k.toLowerCase())))return true;
  if(rule.cats&&rule.cats.includes(ctx.category))return true;
  if(rule.cats&&rule.cats.includes('general')){
    if(overseas)return false;              // overseas handled by explicit overseas rules
    return true;
  }
  return false;
}
const reqs=rule=>rule.requires?(Array.isArray(rule.requires)?rule.requires:[rule.requires]):[];
const reqOk=(r,flags)=>r.type==='plan'?flags[r.key]===r.value:!!flags[r.key];
function reqMet(rule,flags){return reqs(rule).every(r=>reqOk(r,flags));}
function unmetReq(rule,flags){return reqs(rule).find(r=>!reqOk(r,flags))||null;}
function activeGeneralRate(card,flags){let best=0;for(const r of card.rules){if(r.cats&&r.cats.includes('general')&&reqMet(r,flags)&&r.rate>best)best=r.rate;}return best;}
function computeReward(card,rule,ctx,usage,flags){
  const key=(rule.capPerMerchant?rule.id+':'+(ctx.brand||ctx.merchant||''):(rule.capKey||rule.id));
  const used=usage[key]||0;
  const capRem=rule.cap!=null?Math.max(0,rule.cap-used):Infinity;
  const bonusAmt=rule.rate>0?Math.min(ctx.amount,capRem/rule.rate):ctx.amount;
  const fb=rule.fallbackRate??activeGeneralRate(card,flags);
  const reward=bonusAmt*rule.rate+(ctx.amount-bonusAmt)*fb;
  return {reward,capped:bonusAmt<ctx.amount-0.001,bonusAmt,key,fb};
}
function evalCard(card,ctx,opts={}){
  const flags=opts.flags||S.flags, usage=opts.usage||S.usage;
  const opts_=[];
  for(const rule of card.rules){
    if(!ruleMatches(rule,ctx))continue;
    if(rule.minBill&&opts.monthTotal!=null&&opts.monthTotal<rule.minBill)continue;
    const c=computeReward(card,rule,ctx,usage,flags);
    opts_.push({card,rule,reward:c.reward,capped:c.capped,capKey:c.key,fb:c.fb,active:reqMet(rule,flags),effRate:ctx.amount?c.reward/ctx.amount:0});
  }
  opts_.sort((a,b)=>b.reward-a.reward);
  const best=opts_.find(o=>o.active)||null;
  const potential=opts_.find(o=>!o.active&&(!best||o.reward>best.reward+0.005))||null;
  return {card,options:opts_,best,potential};
}
function recommend(ctx,cards=walletCards(),opts={}){
  const evals=cards.map(c=>evalCard(c,ctx,opts));
  const ranked=evals.filter(e=>e.best).sort((a,b)=>b.best.reward-a.best.reward);
  const winner=ranked[0]||null;
  let unlock=null;
  for(const e of evals){if(e.potential&&(!winner||e.potential.reward>winner.best.reward+0.005)&&(!unlock||e.potential.reward>unlock.reward))unlock=e.potential;}
  return {ctx,evals,ranked,winner:winner?winner.best:null,unlock};
}
function applyUsage(opt){if(opt.rule.cap!=null){S.usage[opt.capKey]=(S.usage[opt.capKey]||0)+Math.min(opt.reward,opt.rule.cap);}}

/* statement analysis: actual vs best-now vs best-with-actions, greedy caps in date order */
function analyzeStatement(txns,cardUsedId){
  const cards=walletCards();
  const used=cardById(cardUsedId)||cards[0];
  const total=txns.reduce((s,x)=>s+x.amount,0);
  const uA={},uN={},uP={};
  const allOn=Object.assign({},S.flags);
  for(const c of cards){for(const r of c.rules){for(const q of reqs(r)){if(q.type!=='plan')allOn[q.key]=true;}}}
  const rows=[];let actual=0,bestNow=0,bestPot=0;
  const fixGain={};
  const addFix=(key,gain,meta)=>{if(gain<=0.001)return;fixGain[key]=fixGain[key]||{gain:0,n:0,meta};fixGain[key].gain+=gain;fixGain[key].n++;};
  for(const x of [...txns].sort((a,b)=>(a.date||'').localeCompare(b.date||''))){
    const ctx={merchant:x.merchant,brand:x.brand||x.merchant,category:x.category||'general',amount:x.amount,country:x.country||'TW',online:!!x.online};
    // actual: card used, current flags
    const ea=used?evalCard(used,ctx,{usage:uA,monthTotal:total}):null;
    const a=ea&&ea.best?ea.best.reward:0; if(ea&&ea.best)bump(uA,ea.best);
    // best now: any wallet card, current flags
    const rn=recommend(ctx,cards,{usage:uN,monthTotal:total});
    const n=rn.winner?rn.winner.reward:0; if(rn.winner)bump(uN,rn.winner);
    // best possible: all registrations on + best plan per day
    let p=0,pOpt=null;
    for(const c of cards){
      const plans=c.plan?Object.keys(c.plan.options):[null];
      for(const pl of plans){
        const fl=Object.assign({},allOn);if(c.plan)fl[c.plan.key]=pl;
        const e=evalCard(c,ctx,{flags:fl,usage:uP,monthTotal:total});
        if(e.best&&e.best.reward>p){p=e.best.reward;pOpt=e.best;}
      }
    }
    if(pOpt)bump(uP,pOpt);
    actual+=a;bestNow+=n;bestPot+=p;
    // attribute fixes
    if(pOpt&&reqs(pOpt.rule).length){const q=reqs(pOpt.rule).find(x=>!reqOk(x,S.flags))||reqs(pOpt.rule)[0];addFix(q.type==='plan'?('plan:'+pOpt.card.id):q.key,p-n,{card:pOpt.card,rule:pOpt.rule,req:q});}
    if(rn.winner&&rn.winner.card.id!==(used&&used.id)){addFix('switch:'+rn.winner.card.id,n-a,{card:rn.winner.card,from:used});}
    rows.push({txn:x,actual:a,bestNow:n,bestPot:p,winner:rn.winner,pot:pOpt});
  }
  function bump(u,opt){if(opt.rule.cap!=null)u[opt.capKey]=(u[opt.capKey]||0)+Math.min(opt.reward,opt.rule.cap);}
  const fixes=Object.entries(fixGain).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.gain-a.gain).slice(0,3);
  const byCat={};for(const r of rows){const c=r.txn.category||'general';byCat[c]=byCat[c]||{actual:0,best:0,amt:0};byCat[c].actual+=r.actual;byCat[c].best+=r.bestPot;byCat[c].amt+=r.txn.amount;}
  return {rows,total,actual,bestNow,bestPot,left:bestPot-actual,fixes,byCat,used};
}

/* ---------- gamification ---------- */
const LEVELS=[0,100,300,700,1500];
function levelInfo(){let i=0;while(i<LEVELS.length-1&&S.xp>=LEVELS[i+1])i++;const cur=LEVELS[i],next=LEVELS[i+1]??LEVELS[i]*2;return {n:i+1,name:t('lvl')[i],p:Math.min(1,(S.xp-cur)/Math.max(1,next-cur)),next};}
function gainXP(n,msg){S.xp+=n;save();toast((msg?msg+'  ':'')+t('xpGain',{n}));renderLvl();}
</script>
<script>

function go(id){$$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='home'){renderHome();}if(id==='galaxy'){renderGalaxy();}}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
let toastT;function toast(msg,err){const el=$('#toast');el.innerHTML='<div class="'+(err?'err':'')+'">'+msg+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',err?4200:2200);}
function sheet(html){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('on');}

$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

function cardFace(card,cls){const art=CARD_ART[card.id];if(art)return '<div class="'+cls+'"><img src="'+art+'" alt=""></div>';return '<div class="'+cls+' solid" style="background:'+(card.color||'#333')+';color:'+(lightBg(card.color)?'#000':'#fff')+'">'+esc(L(card.name))+'</div>';}
function lightBg(hex){if(!hex)return false;const n=parseInt(hex.slice(1),16);const r=n>>16,g=(n>>8)&255,b=n&255;return (r*299+g*587+b*114)/1000>150;}
function applyT(){if(typeof mountIcons==='function')mountIcons();$$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('#langBtn').textContent=LANG==='zh'?'EN':'繁';document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';}
function setLang(l){LANG=l;S.lang=l;save();applyT();renderLvl();renderHome();const act=$$('.screen.active')[0];if(act&&act.id==='wallet')renderWallet();if(act&&act.id==='statement'&&lastStmt)renderStmtResult(lastStmt);if(act&&act.id==='result'&&lastRec)renderResult(lastRec);if(act&&act.id==='galaxy')renderGalaxy();}
$('#langBtn').addEventListener('click',()=>setLang(LANG==='zh'?'en':'zh'));
function renderLvl(){const li=levelInfo();$('#lvlPill').innerHTML='<span>'+t('lvlShort',{n:li.n})+' '+esc(li.name)+'</span><span style="opacity:.7">·</span><span>'+money(S.saved)+'</span>';const g=$('#gxLvl');if(g)g.innerHTML=$('#lvlPill').innerHTML;}

/* global touch feedback: ripple at the touch point + flash on the pressed control */
document.addEventListener('pointerdown',e=>{const r=document.createElement('div');r.className='tap-ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);
  const el=e.target.closest('button,.btn,.icon-btn,.pill,.stk,.wl-card,.wcard,.quest,.samples button,.stmt-saved,.hist,.alt,.tap');if(el){el.classList.remove('pressed');void el.offsetWidth;el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),450);}},{passive:true});
/* confetti (accent only, brief) */
function confetti(){const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);const P=[];for(let i=0;i<70;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:3+Math.random()*4,a:1,c:Math.random()<.7?'#30e3a2':'#fff'});let f=0;(function step(){ctx.clearRect(0,0,innerWidth,innerHeight);f++;for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.98;p.a-=.016;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r*1.6);}if(f<80)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight);})();}

/* ---------- HOME / stack / tilt ---------- */
let camOn=false,tiltOn=false,camTried=false;
async function startCam(){camTried=true;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});const v=$('#cam');v.srcObject=s;await v.play();camOn=true;document.body.classList.remove('nocam');}catch(e){camOn=false;document.body.classList.add('nocam');}renderHome();}
function renderHome(){
  $('#homeHint').innerHTML='<b>'+esc(t('hintTitle'))+'</b>'+esc(camOn?t('hintSub'):t('hintNoCam'));
  const sc=$('#scenes');sc.innerHTML='<span class="lab">'+esc(t('scenesLab'))+'</span>'+t('scenes').map((s,i)=>'<button data-i="'+i+'">'+esc(s[1])+'</button>').join('');
  sc.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>runScene(+b.dataset.i)));
  const st=$('#stack');const cards=walletCards();st.innerHTML='';
  const n=cards.length;
  cards.forEach((c,i)=>{const el=document.createElement('div');el.className='stk';el.innerHTML=cardFace(c,'').replace('<div class=""','<div').replace('<div class=" solid"','<div class="solid"');
    if(!CARD_ART[c.id]){el.classList.add('solid');el.style.background=c.color;el.style.color=lightBg(c.color)?'#000':'#fff';el.textContent=L(c.name);}
    const k=i-(n-1)/2;el.style.transform='translateX('+(k*34)+'px) translateY('+(Math.abs(k)*6)+'px) rotate('+(k*7)+'deg)';el.style.zIndex=10-Math.abs(k);el.dataset.id=c.id;el.addEventListener('click',()=>{requestTilt();go('wallet');});st.appendChild(el);});
  const add=document.createElement('div');add.className='stk add';add.textContent='＋';add.style.transform='translateX('+((n)/2*34+20)+'px) translateY(10px) rotate('+((n)/2*7+4)+'deg)';add.style.zIndex=0;add.addEventListener('click',()=>{go('wallet');openAdd();});st.appendChild(add);
  if(!n){add.style.transform='';add.textContent='＋ '+t('addcard');}
}
function requestTilt(){if(tiltOn)return;const D=window.DeviceOrientationEvent;if(D&&typeof D.requestPermission==='function'){D.requestPermission().then(r=>{if(r==='granted')bindTilt();}).catch(()=>{});}else if(D){bindTilt();}}
function bindTilt(){if(tiltOn)return;tiltOn=true;window.addEventListener('deviceorientation',e=>{const g=(e.gamma||0),b=(e.beta||0)-45;const st=$('#stack');st.style.transform='rotateY('+(g*.35)+'deg) rotateX('+(-b*.25)+'deg)';const h=$('.hero');if(h){h.style.setProperty('--shx',(50+g*2.5)+'%');}const st2=$('#wlStage');if(st2)st2.style.transform='rotateY('+(g*.25)+'deg) rotateX('+(-b*.15)+'deg)';},true);}
window.addEventListener('mousemove',e=>{const g=(e.clientX/innerWidth-.5)*40,b=(e.clientY/innerHeight-.5)*30;const h=$('.hero');if(h){h.style.setProperty('--shx',(50+g*2.5)+'%');}});

/* ---------- capture ---------- */
function snapshot(){const v=$('#cam');const c=$('#work');const w=v.videoWidth||1280,h=v.videoHeight||720;const s=Math.min(1,1280/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82);}
function fileToDataURL(file,max=1280){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=$('#work');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=u;});}
let filePick=null;
function pickFile(useCam){return new Promise(res=>{filePick=res;const inp=useCam?$('#fileCam'):$('#fileIn');inp.value='';inp.click();});}
['#fileIn','#fileCam'].forEach(id=>$(id).addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!filePick)return;const cb=filePick;filePick=null;try{cb(await fileToDataURL(f));}catch(err){cb(null);}}));

/* ---------- PURCHASE FLOW ---------- */
let lastRec=null,pendingImg=null;
$('#shutter').addEventListener('click',async()=>{
  if(camOn){analyzePurchase(snapshot(),'');}
  else{const img=await pickFile(true);if(img)analyzePurchase(img,'');}
});
function runScene(i){const s=t('scenes')[i];const img=sceneImage(s);analyzePurchase(img,s[4],{sceneCat:s[2],sceneAmt:s[3],sceneName:s[1]});}
let scanTimer;
function showScan(keys,sub){go('result');$('#resBody').innerHTML='';$('#scanUI').style.display='flex';$('#resMerchant').textContent='';$('#resAmt').textContent='';const ks=t(keys);let i=0;$('#scanTxt').textContent=ks[0];$('#scanSub').textContent=sub||t('scanSub');mood('#scanMascot','think');scanChipsStart();clearInterval(scanTimer);scanTimer=setInterval(()=>{i=(i+1)%ks.length;$('#scanTxt').textContent=ks[i];},1400);}
function hideScan(){clearInterval(scanTimer);scanChipsStop();$('#scanUI').style.display='none';}
async function analyzePurchase(img,hint,demo){
  pendingImg=img;$('#resBgImg').src=img;showScan('scanning');
  let ctx;
  try{ctx=await readPurchase(img,hint,demo);}catch(e){hideScan();showError(e);return;}
  if(ctx.amount==null&&ctx.amount_twd!=null)ctx.amount=ctx.amount_twd;ctx.amount=ctx.amount==null||isNaN(ctx.amount)?null:+ctx.amount;if(!ctx.brand)ctx.brand=ctx.merchant;
  if(!CATS.includes(ctx.category))ctx.category='general';
  if(ctx.amount==null||ctx.amount<=0){hideScan();askAmount(ctx);return;}
  finishPurchase(ctx);
}
function askAmount(ctx){sheet('<h3>'+esc(t('amtTitle'))+'</h3><p>'+esc(ctx.merchant||'')+' · '+esc(t('amtSub'))+'</p><div class="field"><input class="big" id="amtIn" type="number" inputmode="decimal" placeholder="0"></div><button class="btn accent block" id="amtGo">'+esc(t('calc'))+' →</button>');setTimeout(()=>$('#amtIn').focus(),50);$('#amtGo').addEventListener('click',()=>{const v=+$('#amtIn').value;if(!(v>0))return;ctx.amount=v;closeSheet();finishPurchase(ctx);});}
function finishPurchase(ctx,fromHistory){hideScan();const rec=recommend(ctx);rec.img=pendingImg;lastRec=rec;
  if(!fromHistory){const w=rec.winner;const h={id:Date.now(),d:Date.now(),m:ctx.merchant,b:ctx.brand,a:ctx.amount,cat:ctx.category,co:ctx.country||'TW',on:!!ctx.online,pm:ctx.payment_methods||[],c:w?w.card.id:null,r:w?w.reward:0,rate:w?w.rule.rate:0,st:'seen'};S.history=(S.history||[]).filter(x=>x.st!==undefined||x.c);S.history.unshift(h);S.history=S.history.slice(0,40);rec.histId=h.id;save();gainXP(10);}
  renderResult(rec);}
function reopenHistory(id){const h=(S.history||[]).find(x=>x.id===id);if(!h)return;const ctx={merchant:h.m,brand:h.b||h.m,category:h.cat,amount:h.a,country:h.co||'TW',online:!!h.on,payment_methods:h.pm||[]};pendingImg=textImage(h.m+' · '+money(h.a));$('#resBgImg').src=pendingImg;go('result');hideScan();const rec=recommend(ctx);rec.img=pendingImg;rec.histId=h.id;lastRec=rec;renderResult(rec);}
function showError(e){go('home');const m=String(e&&e.message||e);toast(m==='NOKEY'?t('errKey'):t('errNet',{e:m.slice(0,160)}),true);if(m==='NOKEY')setTimeout(openSettings,600);}
$('#resClose').addEventListener('click',()=>go('home'));
$('#resEdit').addEventListener('click',()=>{if(!lastRec)return;const c=lastRec.ctx;sheet('<h3>'+esc(t('editTitle'))+'</h3><div class="field"><label>'+esc(t('merchant'))+'</label><input id="edM" value="'+esc(c.merchant||'')+'"></div><div class="field"><label>'+esc(t('amount'))+'</label><input id="edA" type="number" inputmode="decimal" value="'+(c.amount||'')+'"></div><div class="field"><label>'+esc(t('category'))+'</label><select id="edC">'+CATS.map(k=>'<option value="'+k+'"'+(k===c.category?' selected':'')+'>'+esc(catName(k))+'</option>').join('')+'</select></div><button class="btn accent block" id="edGo">'+esc(t('calc'))+' →</button>');$('#edGo').addEventListener('click',()=>{c.merchant=$('#edM').value;c.brand=c.merchant;c.amount=+$('#edA').value||c.amount;c.category=$('#edC').value;closeSheet();const rec=recommend(c);rec.img=lastRec.img;rec.histId=lastRec.histId;const hh=(S.history||[]).find(x=>x.id===rec.histId);if(hh){hh.m=c.merchant;hh.a=c.amount;hh.cat=c.category;if(rec.winner){hh.c=rec.winner.card.id;hh.r=rec.winner.reward;hh.rate=rec.winner.rule.rate;}save();}lastRec=rec;renderResult(rec);});});
function payLine(opt,ctx){const pm=ctx.payment_methods||[];if(ctx.online)return t('payOnline');if(opt.card.id==='ctbc_linepay'&&pm.includes('linepay'))return t('payLine');return t('payCard');}
function renderResult(rec,showAlts){
  const ctx=rec.ctx,w=rec.winner;
  $('#resMerchant').textContent=(ctx.merchant||'?');
  const d=new Date();$('#resAmt').textContent=money(ctx.amount)+' · '+catName(ctx.category)+(ctx.country&&ctx.country!=='TW'?' · '+ctx.country:'')+' · '+(LANG==='zh'?'週':'')+t('dow')[d.getDay()];
  const body=$('#resBody');
  if(!w){body.innerHTML='<div class="empty">'+esc(t('noCards'))+'</div><button class="btn accent block" onclick="go(\'wallet\');openAdd()">'+esc(t('addcard'))+'</button>';return;}
  let h='<div class="read" id="readStrip"><div class="k">'+esc(t('readBy'))+'</div><div class="m"><b>'+esc(ctx.merchant||'?')+'</b><span><i>'+esc(money(ctx.amount))+'</i> · '+esc(catName(ctx.category))+(ctx.country&&ctx.country!=='TW'?' · '+esc(ctx.country):'')+'</span></div><span class="e">✎ '+esc(t('fixRead'))+'</span></div>';
  h+=cardFace(w.card,'hero');
  h+='<div class="rate">'+pct(w.rule.rate)+'</div>';
  h+='<div class="cardname">'+esc(L(w.card.name))+' · '+esc(L(w.rule.label))+'</div>';
  h+='<div class="back">'+esc(t('back'))+' <b>'+esc(w.card.currency.type==='cash'?money(w.reward):rewardLabel(w.card,w.reward))+'</b>'+(w.capped?'<small>'+esc(t('capHit',{r:pct(w.fb)}))+'</small>':'')+'</div>';
  const cond=w.capped?t('capHit',{r:pct(w.fb)}):(L(w.rule.cond)||t('noCap'));
  h+='<div class="cond"><span class="k">'+esc(t('theOne'))+'</span><span>'+esc(cond)+'</span></div>';
  if(rec.unlock){const u=rec.unlock;const gain=u.reward-w.reward;h+='<div class="unlock"><div class="k">'+esc(t('unlockK',{x:money(gain)}))+'</div><div class="v">'+esc(L(u.card.name))+' · '+pct(u.rule.rate)+' → '+esc(u.card.currency.type==='cash'?money(u.reward):rewardLabel(u.card,u.reward))+'</div><div class="h">'+esc(L((unmetReq(u.rule,S.flags)||reqs(u.rule)[0]).howto))+'</div><button class="b" id="unlockDo">'+esc(t('unlockDone'))+'</button></div>';}
  h+='<div class="pay">'+payLine(w,ctx)+'</div>';
  h+='<div class="actions"><button class="btn ghost" id="altBtn">'+esc(t('others'))+'</button><button class="btn accent" id="useBtn">✓ '+esc(t('useThis'))+'</button></div>';
  if(showAlts){h+='<div class="alts">'+rec.evals.map(e=>{const o=e.best||e.options[0];if(!o)return '';const locked=!e.best;return '<div class="alt'+(locked?' locked':'')+'">'+cardFace(e.card,'thumb')+'<div class="n">'+esc(L(e.card.name))+'<small>'+esc(L(o.rule.label))+(locked?' · 🔒':'')+'</small></div><div class="r">'+pct(o.rule.rate)+'<small>'+esc(money(o.reward))+'</small></div></div>';}).join('')+'</div>';}
  body.innerHTML=h;
  const rs=$('#readStrip');if(rs)rs.addEventListener('click',()=>$('#resEdit').click());
  $('#altBtn').addEventListener('click',()=>renderResult(rec,!showAlts));
  $('#useBtn').addEventListener('click',()=>{applyUsage(w);const base=evalCard(cardById(S.defaultCard)||w.card,ctx).best;const gain=Math.max(0,w.reward-(base?base.reward:0));S.saved+=gain;const hh=(S.history||[]).find(x=>x.id===rec.histId);if(hh){hh.st='used';hh.c=w.card.id;hh.r=w.reward;hh.rate=w.rule.rate;hh.g=gain;}save();confetti();mood('#gxMascot','happy');setTimeout(()=>mood('#gxMascot',null),6000);gainXP(25,gain>0?'+'+money(gain):'');setTimeout(()=>{if($('#result').classList.contains('active'))go('home');},1400);});
  const ub=$('#unlockDo');if(ub)ub.addEventListener('click',()=>{const r=unmetReq(rec.unlock.rule,S.flags)||reqs(rec.unlock.rule)[0];if(r.type==='plan')S.flags[r.key]=r.value;else S.flags[r.key]=true;save();gainXP(50);const nr=recommend(ctx);nr.img=rec.img;lastRec=nr;renderResult(nr);});
}
</script>
<script>
/* ---------- WALLET ---------- */
$('#walletBtn').addEventListener('click',()=>{go('wallet');renderWallet();});
$('#addCardBtn').addEventListener('click',openAdd);
function questList(){
  const q=[];const cards=walletCards();
  for(const c of cards){for(const r of c.rules){for(const req of reqs(r)){if(req.type==='plan')continue;const key=req.key;if(q.some(x=>x.key===key))continue;const done=!!S.flags[key];q.push({key,done,card:c,rule:r,req,xp:50});}}
    if(c.plan){const key='plan:'+c.id;q.push({key,done:!!S.flags[c.plan.key],card:c,plan:true,xp:30});}}
  return q.sort((a,b)=>(a.done?1:0)-(b.done?1:0));
}
function renderWallet(){
  const cards=walletCards();const li=levelInfo();
  let h='<div class="page-title">'+esc(t('wallet'))+'</div>';
  h+='<div class="two"><div class="stat"><div class="k">'+esc(t('savedMonth'))+'</div><div class="v acc mono">'+esc(money(S.saved))+'</div><div class="s">'+esc(t('savedSub'))+'</div></div>';
  h+='<div class="lvl-ring" style="flex-direction:column;align-items:flex-start;gap:8px"><div class="ring" style="--p:'+Math.round(li.p*100)+'%"><i>'+li.n+'</i></div><div class="tx"><b>'+esc(li.name)+'</b><small>'+S.xp+' / '+li.next+' XP</small></div></div></div>';
  h+='<div class="h2">'+esc(t('cards'))+' · '+cards.length+'</div>';
  if(!cards.length)h+='<div class="empty">'+esc(t('noCards'))+'</div>';
  h+='<div class="card-row">'+cards.map(c=>{const g=activeGeneralRate(c,S.flags);let top=0,topR=null;for(const r of c.rules){if(reqMet(r,S.flags)&&r.rate>top&&!(r.cats&&r.cats.length===0)){top=r.rate;topR=r;}}
    const tags=[];if(c.unverified)tags.push('<span class="tag ai">'+esc(t('aiCard'))+'</span>');else{const pend=c.rules.some(r=>reqs(r).some(q=>q.type!=='plan'&&!S.flags[q.key]));if(pend)tags.push('<span class="tag warn">!</span>');}
    return '<div class="wcard'+(S.defaultCard===c.id?' def':'')+'" data-id="'+c.id+'">'+cardFace(c,'face')+tags.join('')+'<div class="nm">'+esc(L(c.name))+'</div><div class="bt"><b>'+pct(top)+'</b><small>'+esc(topR?L(topR.label):'')+'</small></div><div class="bt"><small>'+esc(t('general'==='x'?'':catName('general')))+' '+pct(g)+'</small>'+(c.plan?'<small>'+esc(S.flags[c.plan.key]?t('cubePlan',{p:L(c.plan.options[S.flags[c.plan.key]])}):t('cubeNone'))+'</small>':'')+'</div></div>';}).join('')+'</div>';
  const qs=questList();
  if(qs.length){h+='<div class="h2">'+esc(t('quests'))+'</div>'+qs.map(q=>{if(q.plan){const c=q.card;return '<div class="quest'+(q.done?' done':'')+'" data-q="'+q.key+'"><div class="ic">'+ic(q.done?'check':'plan')+'</div><div class="tx"><b>'+esc(L(c.name))+' · '+esc(q.done?t('cubePlan',{p:L(c.plan.options[S.flags[c.plan.key]])}):t('cubeNone'))+'</b><small>'+Object.entries(c.plan.options).map(([k,v])=>'<span class="tap" data-plan="'+k+'" data-card="'+c.id+'">'+esc(L(v))+'</span>').join(' · ')+'</small></div><div class="xp">+'+q.xp+'</div></div>';}
    return '<div class="quest'+(q.done?' done':'')+'" data-q="'+q.key+'"><div class="ic">'+ic(q.done?'check':(q.req.type==='register'?'register':'bank'))+'</div><div class="tx"><b>'+esc(L(q.card.name))+' · '+esc(L(q.rule.label))+' '+pct(q.rule.rate)+'</b><small>'+esc(L(q.req.howto))+'</small></div><div class="xp">'+(q.done?'✓':'+'+q.xp)+'</div></div>';}).join('');}
  const hist=(S.history||[]).filter(x=>x.id).slice(0,8);
  if(hist.length){h+='<div class="h2">'+esc(t('recent'))+' · '+hist.length+'</div>'+hist.map(x=>{const c=cardById(x.c);return '<div class="hist'+(x.st==='used'?' used':'')+'" data-h="'+x.id+'">'+(c?cardFace(c,'thumb'):'<div class="thumb"></div>')+'<div class="tx"><b>'+esc(x.m||'')+'</b><small>'+esc(money(x.a))+' · '+esc(catName(x.cat))+' · '+esc(new Date(x.d).toLocaleDateString(LANG==='zh'?'zh-TW':'en-US',{month:'numeric',day:'numeric'}))+'</small></div><div class="r"><b>'+(x.rate?pct(x.rate):'—')+'</b><small>'+esc(c?shortName(c):'')+' · '+esc(x.st==='used'?t('used'):t('seen'))+'</small></div></div>';}).join('');}
  h+='<div class="h2">'+esc(t('bestRates'))+'</div><div class="bars">'+cards.map(c=>{let top=0;for(const r of c.rules){if(reqMet(r,S.flags)&&r.rate>top&&!(r.cats&&r.cats.length===0))top=r.rate;}return '<div class="bar"><div class="n">'+esc(L(c.name))+'</div><div class="t"><div class="f" style="width:'+Math.min(100,top/0.10*100)+'%"></div></div><div class="v">'+pct(top)+'</div></div>';}).join('')+'<div class="note" style="margin-top:8px">'+esc(LANG==='zh'?'依目前登錄／方案狀態算出的最高回饋率；上限與門檻在推薦時才套用。':'Highest rate under current registration/plan state; caps and thresholds apply at recommendation time.')+'</div></div>';
  h+='<div class="h2">'+esc(t('sourceLab'))+'</div><div class="src">'+cards.map(c=>'<div>'+esc(L(c.name))+' · <a href="'+esc(c.source)+'" target="_blank" rel="noopener">'+esc((c.source||'').replace(/^https?:\/\//,'').slice(0,42))+'…</a> · '+esc(t('verified'))+' '+esc(c.verified||'')+'</div>').join('')+'</div>';
  const b=$('#walletBody');b.innerHTML=h;
  b.querySelectorAll('.wcard').forEach(el=>el.addEventListener('click',()=>cardSheet(el.dataset.id)));
  b.querySelectorAll('[data-h]').forEach(el=>el.addEventListener('click',()=>reopenHistory(+el.dataset.h)));
  b.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const c=cardById(el.dataset.card);const was=S.flags[c.plan.key];S.flags[c.plan.key]=el.dataset.plan;save();if(!was)gainXP(30);renderWallet();}));
  b.querySelectorAll('.quest:not(.done)[data-q]').forEach(el=>{const key=el.dataset.q;if(key.startsWith('plan:'))return;el.addEventListener('click',()=>{S.flags[key]=true;save();gainXP(50,t('done'));renderWallet();});});
}
function cardSheet(id){const c=cardById(id);if(!c)return;let h='<h3>'+esc(L(c.name))+'</h3><p>'+esc(L(c.bank))+' · '+esc(c.network||'')+(c.unverified?' · '+esc(t('aiCard')):'')+'</p>';
  h+=c.rules.filter(r=>!(r.cats&&r.cats.length===0&&!r.merchants)).map(r=>'<div class="alt"><div class="n">'+esc(L(r.label))+'<small>'+esc(L(r.cond)||'')+'</small></div><div class="r'+(reqMet(r,S.flags)?'':' locked')+'">'+pct(r.rate)+(reqMet(r,S.flags)?'':'<small>🔒</small>')+'</div></div>').join('');
  h+='<div class="src">'+esc(t('sourceLab'))+': <a href="'+esc(c.source)+'" target="_blank" rel="noopener">'+esc(c.source)+'</a>'+(c.sources?c.sources.map(s=>'<br><a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>').join(''):'')+' · '+esc(t('verified'))+' '+esc(c.verified||'')+'</div>';
  h+='<div class="grid-btns" style="margin-top:14px"><button class="btn ghost sm block" id="csDef">'+esc(t('setDefault'))+'</button><button class="btn ghost sm block" id="csRm" style="color:var(--danger)">'+esc(t('remove'))+'</button></div>';
  sheet(h);$('#csDef').addEventListener('click',()=>{S.defaultCard=id;save();closeSheet();renderWallet();});$('#csRm').addEventListener('click',()=>{S.wallet=S.wallet.filter(x=>x!==id);save();closeSheet();renderWallet();renderHome();});}

/* ---------- ADD CARD ---------- */
function openAdd(){go('addcard');
  let h='<div class="page-title">'+esc(t('addTitle'))+'</div><div class="page-sub">'+esc(t('addSub'))+'</div>';
  h+='<div class="grid-btns"><button class="btn accent" id="addShoot">'+ic('camera')+' '+esc(t('takePhoto'))+'</button><button class="btn ghost" id="addPick">'+esc(t('pickPhoto'))+'</button></div>';
  h+='<div class="h2">'+esc(t('samples'))+'</div><div class="samples">'+CATALOG.filter(c=>CARD_ART[c.id]).map(c=>'<button data-s="'+c.id+'" class="'+(S.wallet.includes(c.id)?'has':'')+'"><img src="'+CARD_ART[c.id]+'" alt=""></button>').join('')+'</div>';
  h+='<div style="margin-top:14px"><button class="btn ghost sm block" id="loadDemo">'+esc(t('loadDemo'))+'</button></div>';
  $('#addBody').innerHTML=h;
  $('#addShoot').addEventListener('click',async()=>{const img=await pickFile(true);if(img)openMask(img);});
  $('#addPick').addEventListener('click',async()=>{const img=await pickFile(false);if(img)openMask(img);});
  $$('#addBody [data-s]').forEach(b=>b.addEventListener('click',()=>openMask(CARD_ART[b.dataset.s],b.dataset.s)));
  $('#loadDemo').addEventListener('click',()=>{S.wallet=DEFAULT_WALLET.slice();save();renderHome();go('wallet');renderWallet();toast('✓');});
}
/* MASK: draw on canvas, nothing leaves until done */
let maskBase=null,maskStrokes=[],maskDemoId=null,drawing=false;
function openMask(dataURL,demoId){maskDemoId=demoId||null;go('mask');const img=new Image();img.onload=()=>{maskBase=img;const cv=$('#maskCv');cv.width=img.width;cv.height=img.height;maskStrokes=[];redrawMask();};img.src=dataURL;}
function redrawMask(){const cv=$('#maskCv'),c=cv.getContext('2d');c.drawImage(maskBase,0,0);c.fillStyle='#0b0b0c';c.strokeStyle='#0b0b0c';c.lineCap='round';c.lineJoin='round';for(const s of maskStrokes){if(s.rect){c.fillRect(...s.rect);continue;}c.lineWidth=s.w;c.beginPath();s.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(s.pts.length===1)c.lineTo(s.pts[0][0]+.1,s.pts[0][1]);c.stroke();}}
(function(){const cv=$('#maskCv');const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);maskStrokes.push({w:Math.max(28,cv.width*.07),pts:[pos(e)]});redrawMask();e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!drawing)return;maskStrokes[maskStrokes.length-1].pts.push(pos(e));redrawMask();e.preventDefault();});
const end=()=>{drawing=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);})();
$('#maskUndo').addEventListener('click',()=>{maskStrokes.pop();redrawMask();});
$('#maskAuto').addEventListener('click',()=>{const cv=$('#maskCv');const W=cv.width,H=cv.height;const portrait=H>W;
  // cover the usual number/name band: middle-lower band for landscape, left-middle band for portrait (card rotated)
  maskStrokes.push({rect:portrait?[0,H*.12,W*.2,H*.45]:[W*.05,H*.5,W*.75,H*.22]});redrawMask();});
$('#maskBack').addEventListener('click',()=>openAdd());
$('#maskDone').addEventListener('click',async()=>{const cv=$('#maskCv');const out=$('#work');const s=Math.min(1,900/Math.max(cv.width,cv.height));out.width=Math.round(cv.width*s);out.height=Math.round(cv.height*s);out.getContext('2d').drawImage(cv,0,0,out.width,out.height);const masked=out.toDataURL('image/jpeg',.8);identifyFlow(masked);});
async function identifyFlow(masked){
  showScan('scanning',t('idSub'));
  let r;try{r=await identifyCard(masked,maskDemoId);}catch(e){hideScan();showError(e);return;}
  hideScan();go('addcard');
  const c=r&&r.matched_card_id&&r.matched_card_id!=='none'?cardById(r.matched_card_id):null;
  if(c){sheet('<h3>'+esc(t('idTitle'))+'</h3><p>'+esc(t('idSub'))+' · '+Math.round((r.confidence||0)*100)+'%</p>'+cardFace(c,'hero').replace('class="hero"','class="hero" style="animation:none;margin:0 auto 14px"')+'<div style="text-align:center;font-weight:800;font-size:20px;margin-bottom:14px">'+esc(L(c.name))+'</div><button class="btn accent block" id="idYes">'+esc(t('yesAdd'))+'</button><div style="height:10px"></div><button class="btn ghost block" id="idNo">'+esc(t('noRe'))+'</button>');
    $('#idYes').addEventListener('click',()=>{if(!S.wallet.includes(c.id))S.wallet.push(c.id);save();closeSheet();confetti();gainXP(40,'+ '+L(c.name));renderHome();go('wallet');renderWallet();});
    $('#idNo').addEventListener('click',closeSheet);
  }else{
    sheet('<h3>'+esc(t('notFound'))+'</h3><p>'+esc((r&&(r.bank_guess||''))+' '+(r&&(r.card_name_guess||'')))+'</p><button class="btn accent block" id="idRes">'+esc(t('research'))+'</button><div class="note" style="margin-top:8px">'+esc(t('researchSub'))+'</div>');
    $('#idRes').addEventListener('click',()=>{closeSheet();researchFlow(r);});
  }
}
async function researchFlow(guess){
  showScan('researching',t('researchSub'));
  let entry;try{entry=await researchCard(guess);}catch(e){hideScan();showError(e);return;}
  hideScan();go('addcard');
  const c=normalizeResearched(entry);
  sheet('<h3>'+esc(L(c.name))+'</h3><p>'+esc(L(c.bank))+' · '+esc(t('aiCard'))+'</p>'+c.rules.map(r=>'<div class="alt"><div class="n">'+esc(L(r.label))+'<small>'+esc(L(r.cond)||'')+'</small></div><div class="r">'+pct(r.rate)+'</div></div>').join('')+'<div class="src">'+(c.sources||[]).map(s=>'<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>').join('<br>')+'</div><div style="height:12px"></div><button class="btn accent block" id="rsYes">'+esc(t('yesAdd'))+'</button>');
  $('#rsYes').addEventListener('click',()=>{S.custom=S.custom.filter(x=>x.id!==c.id);S.custom.push(c);if(!S.wallet.includes(c.id))S.wallet.push(c.id);save();closeSheet();confetti();gainXP(60,'+ '+L(c.name));renderHome();go('wallet');renderWallet();});
}
function normalizeResearched(e){
  const id='ai_'+String(e.id||e.name_en||'card').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,32);
  const rules=(e.rules||[]).map((r,i)=>{const rr={id:id+'_r'+i,label:{zh:r.label_zh||r.label_en||'',en:r.label_en||r.label_zh||''},cats:(r.cats||[]).filter(c=>CATS.includes(c)),merchants:r.merchants&&r.merchants.length?r.merchants:undefined,rate:Math.max(0,Math.min(0.5,+r.rate||0)),cond:{zh:r.cond_zh||'',en:r.cond_en||''}};
    if(r.cap>0){rr.cap=+r.cap;rr.capPeriod=r.cap_period||'month';}

const KW=[['convenience',['7-11','7-eleven','小七','全家','萊爾富','超商','ok超商']],['supermarket',['全聯','家樂福','好市多','costco','超市','量販','大潤發']],['drugstore',['屈臣氏','康是美','藥妝','寶雅']],['apple',['apple store','apple','iphone','macbook','ipad','airpods','mac ']],['home',['ikea','宜得利','nitori','特力屋','家具','hola','燦坤','全國電子']],['online',['momo','pchome','蝦皮','shopee','amazon','網購','酷澎','coupang']],['streaming',['netflix','spotify','disney','youtube','串流']],['ai_subscription',['chatgpt','openai','gemini','perplexity','copilot','grok','claude']],['telecom',['月租','電信','台灣大哥大','中華電信','遠傳']],['utilities',['台電','電費','水費','瓦斯']],['gas',['加油','中油','台塑','油錢']],['travel',['機票','飯店','訂房','高鐵','agoda','booking','klook','kkday','uber']],['jp_transit_topup',['suica','pasmo','icoca','西瓜卡','儲值']],['overseas_jkt',['東京','日本','大阪','首爾','韓國','曼谷','泰國']],['drinks',['50嵐','清心','可不可','珍奶','奶茶','手搖','星巴克','拿鐵','咖啡','路易莎','cama','茶']],['dining',['壽司','餐廳','麥當勞','肯德基','摩斯','鼎泰豐','火鍋','燒肉','拉麵','吃飯','晚餐','午餐','早餐','八方','客美多','subway','漢堡']],['apparel',['uniqlo','gu','zara','h&m','衣服','外套','褲子','net']]];
function localParse(text){const low=text.toLowerCase();let category='general',brand='';for(const [cat,ks] of KW){const hit=ks.find(k=>low.includes(k.toLowerCase()));if(hit){category=cat;brand=hit;break;}}
  let work=low.replace(/,/g,'');if(brand)work=work.split(brand.toLowerCase()).join(' ');let amount=null,amtStr='';let m=work.match(/(\d+(?:\.\d+)?)\s*(元|塊|nt\$?|twd|dollars?|\$)/i)||work.match(/(?:nt\$?|\$)\s*(\d+(?:\.\d+)?)/i);if(!m){const all=[...work.matchAll(/\d+(?:\.\d+)?/g)];if(all.length){m=all[all.length-1];}}if(m){amount=+(m[1]||m[0]);amtStr=m[0];}
  const merchant=(amtStr?text.replace(new RegExp(amtStr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),''):text).replace(/(元|塊|nt\$?|twd)/ig,'').replace(/[，,。\.\s]+$/,'').trim().slice(0,30)||brand||text;
  return {merchant,brand:brand||merchant,category,amount_twd:amount,country:category==='overseas_jkt'||category==='jp_transit_topup'?'JP':'TW',online:['online','streaming','ai_subscription'].includes(category),payment_methods:['card','linepay'],items:text,confidence:.6,local:true};}
